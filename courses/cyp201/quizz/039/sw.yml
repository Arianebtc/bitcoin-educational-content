question: Je, ni jukumu gani kuu la Bitcoin Wallet?
answer: Dhibiti na uhifadhi private key
wrong_answers:
  - Hifadhi bitcoin za mtumiaji
  - Hakikisha usiri wa miamala kiotomatiki
  - generate bitcoin kwa kila mtumiaji
explanation: |
  Bitcoin Wallet haihifadhi bitcoin moja kwa moja lakini inasimamia funguo za kibinafsi zinazohitajika ili kufungua UTXO zinazowakilisha bitcoins.
reviewed: true
