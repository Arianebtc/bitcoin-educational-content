question: Ni flag gani ya sighash inayotumiwa sana katika miamala ya Bitcoin?
answer: SIGASH_ALL
wrong_answers:
  - SIGHASH_NONE
  - SIGHASH_SINGLE
  - SIGHASH_ANYONECANPAY
explanation: |
  SIGHASH_ALL ndio flag chaguo-msingi ya sighash, inayojumuisha ingizo na matokeo yote ya muamala, kuzuia marekebisho yoyote.
reviewed: true
