question: Ni kizuizi gani cha kupata public child key kutoka kwa public parent key?
answer: Ufunguo wa mtoto lazima uwe wa kawaida
wrong_answers:
  - public child key lazima iwe mgumu
  - Msimbo wa mnyororo lazima ufanane na ule wa parent key
  - Mchakato lazima ujumuishe private parent key
explanation: |
  Public child key unaweza tu kutolewa kutoka kwa parent public key ikiwa ni wa kawaida, sio ngumu.
reviewed: true
