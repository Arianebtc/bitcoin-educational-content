question: Ni operesheni gani inahitajika ili kukokotoa ufunguo wa umma wa Taproot Q?
answer: Ongeza tweak tG kwa public key P
wrong_answers:
  - Zidisha kitufe cha faragha p kwa kubofya
  - Hash public key P na SHA256
  - Unganisha tweak t na public key P
explanation: |
  Ufunguo wa umma wa Taproot Q hupatikana kwa kuongeza bidhaa ya scalar ya tweak t na jenereta G kwa public key P.
reviewed: true
