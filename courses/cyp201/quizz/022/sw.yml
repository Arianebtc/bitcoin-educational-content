question: Public key inahesabiwaje kutoka kwa private key?
answer: Kwa kutumia kuzidisha kwa scalar kwenye elliptic curve
wrong_answers:
  - Kwa kutumia Hash kwenye ufunguo wa kibinafsi
  - Kupitia usimbaji fiche wa asymmetric
  - Kwa kuongeza mara kwa mara ya maadili ya nambari
explanation: |
  Public key unapatikana kwa kuzidisha kwa private key kwa uhakika wa jenereta G kwenye elliptic curve.
reviewed: true
