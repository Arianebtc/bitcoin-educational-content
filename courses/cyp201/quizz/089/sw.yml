question: Ni hatua gani inayotangulia utumiaji wa HASH160 katika utengenezaji wa SegWit v0 Address?
answer: Ukandamizaji wa Public key
wrong_answers:
  - Kuongeza checksum
  - Ubadilishaji hadi umbizo la bech32
  - Usimbaji katika base58check
explanation: |
  Public key lazima ibandikwe ili kupunguza ukubwa wake kabla ya kupitia kitendakazi cha HASH160 Hash.
reviewed: true
