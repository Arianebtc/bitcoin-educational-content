question: Ni aina gani ya ufunguo unaohusishwa na kiambishi awali cha zpub?
answer: Extended public key ya SegWit V0 kwenye Mainnet
wrong_answers:
  - Extended private keys za SegWit V1 kwenye Mainnet
  - Extended public key kwa Legacy kwenye Testnet
  - Extended public key ya SegWit V2 kwenye Testnet
explanation: |
  Kiambishi awali cha zpub kinaashiria Extended public key kwa hati za SegWit V0 kwenye Mainnet.
reviewed: true
