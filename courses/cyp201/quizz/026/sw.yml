question: Ni mahali gani pa kuanzia kuhesabu signature ya ECDSA?
answer: Ujumbe wa Hash
wrong_answers:
  - Public keyd
  - Nonce ya kudumu
  - Mviringo maalum wa duaradufu
explanation: |
  Signature ya ECDSA huanza kwa kukokotoa Hash ya ujumbe utakaotiwa saini, mara nyingi na SHA256.
reviewed: true
