question: Kuna tofauti gani kati ya child keys za kawaidana hardened child key?
answer: Ufunguo mgumu wa mtoto unahitaji ufunguo wa faragha wa mzazi ili uutoe.
wrong_answers:
  - Child keys za kawaida haziwezi kutoka kwa public key.
  - Kitufe kigumu cha mtoto hutumia faharasa isiyo ya kawaida.
  - Ufunguo wa kawaida wa mtoto ni salama zaidi kuliko hardened child key.
explanation: |
  Child keys za kawaida zinaweza kutolewa kutoka kwa public parent key, tofauti na hardened child keyambao unahitaji private parent key.
reviewed: true
