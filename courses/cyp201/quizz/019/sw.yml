question: Ni operesheni gani ya kihesabu iliyo msingi wa usalama wa elliptic curve cryptography?
answer: Tatizo tofauti la logarithm
wrong_answers:
  - Uainishaji wa nambari kuu
  - Uhesabuji wa mabaki ya quadratic
  - Tatizo la mchemraba tofauti
explanation: |
  Usalama wa elliptic curve cryptography unatokana na ugumu wa kutatua tatizo la logarithmu tofauti kwenye mipingo hii.
reviewed: true
