question: Extended public key zinaruhusu kupata nini?
answer: Child public keys za kawaida za pekee
wrong_answers:
  - Child private keys za kawaida pekee
  - hardened public keys na cild keys za kawaida 
  - Private keys za hardened child key
explanation: |
  Ufunguo uliopanuliwa wa umma huruhusu tu kupatikana kwa funguo za umma za watoto, si funguo za faragha au funguo ngumu.
reviewed: true
